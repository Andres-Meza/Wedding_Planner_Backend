spring:
  application:
    name: Wedding_Planner_Backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  cors:
    # Orígenes del frontend permitidos, separados por comas. Para otro origen
    # (por ejemplo http://localhost:4200) defina APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: https://wedding-planner-frontend-two.vercel.app
  menus:
    # Menús que se asignan automáticamente al crear invitados (el nombre debe
    # coincidir con el de la tabla menu; no distingue mayúsculas).
    default-adult-name: 'Menú 1'
    default-kids-name: 'Menú Infantil 1'
